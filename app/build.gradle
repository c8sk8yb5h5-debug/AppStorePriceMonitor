plugins { id 'com.android.application' }

def releaseKeystore = file("release.keystore")
def hasReleaseKeystore = releaseKeystore.exists()

android {
    namespace 'com.octopus.appstorepricemonitor'
    compileSdk 35
    defaultConfig {
        applicationId 'com.octopus.appstorepricemonitor'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv("APP_VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("APP_VERSION_NAME") ?: "0.1.0"
    }

    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: ""
                keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'androidx.core:core:1.15.0'
}
